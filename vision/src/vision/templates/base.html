<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vision{% endblock %}</title>

  <script>
    (function () {
      var t = localStorage.getItem('mp-theme') ||
              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('mp-theme', next);
    }
  </script>

  <!-- NiceAdmin fonts: Nunito Sans (body) + Poppins (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@500;600;700&display=swap">
  <!-- Bootstrap 5 — Bootswatch Yeti theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/yeti/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- DataTables Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/custom.css">

  <!-- jQuery + DataTables loaded in <head> so inline table-init scripts
       inside content blocks have them available on direct page loads too
       (not only on htmx-boosted navigation). -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>
</head>
<body hx-boost="true">

  {% include "_navbar.html" %}

  <div class="d-flex">
    {% include "_sidebar.html" %}
    <main class="flex-grow-1 p-4" style="min-width:0">
      {% block breadcrumb %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>

  {% block scripts %}{% endblock %}

  <!-- Invoice detail modal -->
  <div class="modal fade" id="invoiceDetailModal" tabindex="-1" aria-labelledby="invoiceDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title" id="invoiceDetailModalLabel">
            <i class="bi bi-file-earmark-text me-2"></i><span id="invoice-modal-title">Számla részletei</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
        </div>
        <div id="invoice-detail-modal-body">
          <div class="modal-body"><p class="text-muted">Betöltés…</p></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var invModal = document.getElementById('invoiceDetailModal');

      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-invoice-modal]');
        if (!el) return;
        e.preventDefault();
        invModal._invoiceId = el.getAttribute('data-invoice-modal');
        invModal._invoiceNum = el.textContent.trim();
        bootstrap.Modal.getOrCreateInstance(invModal).show();
      });

      invModal.addEventListener('shown.bs.modal', function () {
        var id = invModal._invoiceId;
        if (!id) return;
        var title = document.getElementById('invoice-modal-title');
        if (invModal._invoiceNum) title.textContent = invModal._invoiceNum;
        fetch('/ui/invoices/' + id + '/modal')
          .then(function (r) { return r.text(); })
          .then(function (html) {
            document.getElementById('invoice-detail-modal-body').innerHTML = html;
          });
      });

      invModal.addEventListener('hidden.bs.modal', function () {
        document.getElementById('invoice-modal-title').textContent = 'Számla részletei';
        document.getElementById('invoice-detail-modal-body').innerHTML =
          '<div class="modal-body"><p class="text-muted">Betöltés…</p></div>';
      });
    })();
  </script>

  <!-- Shared manual-link picker modal -->
  <div class="modal fade" id="pickerModal" tabindex="-1" aria-labelledby="pickerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="pickerModalLabel">Kapcsolat kiválasztása</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
        </div>
        <div class="modal-body" id="picker-modal-body">
          <p class="text-muted">Betöltés…</p>
        </div>
      </div>
    </div>
  </div>
  <div id="picker-preview-popup" style="display:none; position:fixed; z-index:2000; max-width:640px; max-height:85vh; padding:4px; background:#fff; border:1px solid #ccc; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:none;">
    <img style="max-width:100%; max-height:calc(85vh - 8px); display:block;">
  </div>
  <script>
    (function () {
      var pickerModal = document.getElementById('pickerModal');

      var $pickerPreview = $('#picker-preview-popup');
      var $pickerPreviewImg = $pickerPreview.find('img');
      $('#picker-modal-body').on('mouseenter', 'tr', function () {
        var data = $(this).data('preview');
        if (!data) return;
        $pickerPreviewImg.attr('src', 'data:image/png;base64,' + data);
        $pickerPreview.show();
      });
      $('#picker-modal-body').on('mousemove', 'tr', function (e) {
        if ($pickerPreview.is(':visible')) {
          var w = $pickerPreview.outerWidth();
          var h = $pickerPreview.outerHeight();
          var top = e.clientY + 16;
          var left = e.clientX + 16;
          if (left + w > window.innerWidth) left = e.clientX - w - 16;
          if (top + h > window.innerHeight) top = Math.max(8, window.innerHeight - h - 8);
          $pickerPreview.css({ top: top, left: left });
        }
      });
      $('#picker-modal-body').on('mouseleave', 'tr', function () {
        $pickerPreview.hide();
      });

      // Bootstrap 5.3 bug: modal + offcanvas focus traps recurse infinitely.
      // Work-around: hide the offcanvas before the modal opens; restore it after.
      pickerModal.addEventListener('show.bs.modal', function (e) {
        pickerModal._pickerUrl = e.relatedTarget
          ? e.relatedTarget.getAttribute('data-picker-url')
          : null;
        var ocEl = document.querySelector('.offcanvas.show');
        pickerModal._sourceOffcanvas = ocEl || null;
        if (ocEl) { bootstrap.Offcanvas.getInstance(ocEl)?.hide(); }
      });

      pickerModal.addEventListener('shown.bs.modal', function () {
        var url = pickerModal._pickerUrl;
        if (!url) return;
        fetch(url)
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var body = document.getElementById('picker-modal-body');
            body.innerHTML = html;
            htmx.process(body);          // register hx-post forms with HTMX
            var tbl = body.querySelector('table[id]');
            if (!tbl) return;
            if ($.fn.DataTable.isDataTable('#' + tbl.id)) {
              $('#' + tbl.id).DataTable().destroy();
            }
            var colDefs = [{ targets: -1, searchable: false, orderable: false }];
            if (tbl.id === 'picker-invoice-files-table') {
              colDefs.push({ targets: -2, visible: false });
            }
            new DataTable('#' + tbl.id, {
              language: { url: 'https://cdn.datatables.net/plug-ins/2.0.8/i18n/hu.json' },
              pageLength: 10,
              lengthMenu: [10, 25, 50],
              autoWidth: false,
              columnDefs: colDefs,
            });
          });
      });

      pickerModal.addEventListener('hidden.bs.modal', function () {
        $pickerPreview.hide();
        var body = document.getElementById('picker-modal-body');
        var tbl = body.querySelector('table[id]');
        if (tbl && $.fn.DataTable.isDataTable('#' + tbl.id)) {
          $('#' + tbl.id).DataTable().destroy();
        }
        body.innerHTML = '<p class="text-muted">Betöltés…</p>';
        // Restore the offcanvas (if not already re-opened by htmx:afterSwap)
        var ocEl = pickerModal._sourceOffcanvas;
        if (ocEl && !ocEl.classList.contains('show')) {
          bootstrap.Offcanvas.getOrCreateInstance(ocEl).show();
        }
        pickerModal._sourceOffcanvas = null;
      });
    })();
  </script>
</body>
</html>
