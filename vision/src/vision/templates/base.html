<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vision{% endblock %}</title>

  <script>
    (function () {
      var t = localStorage.getItem('mp-theme') ||
              (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('mp-theme', next);
    }
  </script>

  <!-- NiceAdmin fonts: Nunito Sans (body) + Poppins (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@500;600;700&display=swap">
  <!-- Bootstrap 5 — Bootswatch Yeti theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/yeti/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Font Awesome (NiceAdmin icon set) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <!-- DataTables Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css">
  <!-- DataTables Buttons (Excel/PDF/Print export) -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.2.2/css/buttons.bootstrap5.min.css">
  <!-- DataTables Responsive (small-screen column collapse) -->
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.6/css/responsive.bootstrap5.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/custom.css">

  <!-- Libraries loaded in <head> so inline scripts inside content blocks have
       them available on direct page loads too, and — critically — so they are
       NOT re-executed on every hx-boost body swap. Re-running Bootstrap loads a
       second copy whose duplicate data-api handlers double-toggle collapses
       (sidebar dropdown could not be closed after navigating to a submenu). -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/3.2.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/3.2.2/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/3.2.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/3.2.2/js/buttons.print.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/3.0.6/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/3.0.6/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body hx-boost="true">

  {% include "_navbar.html" %}

  <div class="d-flex">
    {% include "_sidebar.html" %}
    <main class="flex-grow-1 p-4" style="min-width:0">
      {% block breadcrumb %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}

  <!-- Invoice detail modal -->
  <div class="modal fade" id="invoiceDetailModal" tabindex="-1" aria-labelledby="invoiceDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h5 class="modal-title" id="invoiceDetailModalLabel">
            <i class="bi bi-file-earmark-text me-2"></i><span id="invoice-modal-title">Számla részletei</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
        </div>
        <div id="invoice-detail-modal-body">
          <div class="modal-body"><p class="text-muted">Betöltés…</p></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var invModal = document.getElementById('invoiceDetailModal');

      // This script re-runs on every hx-boost body swap; the document-level
      // listener must be registered only once and must resolve the current
      // modal element at click time (the captured one gets detached on swap).
      if (!window._invoiceModalClickBound) {
        window._invoiceModalClickBound = true;
        document.addEventListener('click', function (e) {
          var el = e.target.closest('[data-invoice-modal]');
          if (!el) return;
          e.preventDefault();
          var modal = document.getElementById('invoiceDetailModal');
          modal._invoiceId = el.getAttribute('data-invoice-modal');
          modal._invoiceNum = el.textContent.trim();
          bootstrap.Modal.getOrCreateInstance(modal).show();
        });
      }

      invModal.addEventListener('shown.bs.modal', function () {
        var id = invModal._invoiceId;
        if (!id) return;
        var title = document.getElementById('invoice-modal-title');
        if (invModal._invoiceNum) title.textContent = invModal._invoiceNum;
        fetch('/ui/invoices/' + id + '/modal')
          .then(function (r) { return r.text(); })
          .then(function (html) {
            document.getElementById('invoice-detail-modal-body').innerHTML = html;
          });
      });

      invModal.addEventListener('hidden.bs.modal', function () {
        document.getElementById('invoice-modal-title').textContent = 'Számla részletei';
        document.getElementById('invoice-detail-modal-body').innerHTML =
          '<div class="modal-body"><p class="text-muted">Betöltés…</p></div>';
      });

      // Several pages (invoices/transactions/customer_detail/supplier_detail) define their
      // own #txOffcanvas + #tx-offcanvas-body and want it shown once a transaction loads into
      // it. This listener is centralized here (guarded, like the click binding above) because
      // document.body survives hx-boost swaps — a per-page copy of this listener re-registered
      // on every revisit, and the resulting pile-up called bootstrap.Offcanvas.show() multiple
      // times per click, corrupting its backdrop and blocking clicks page-wide until a refresh.
      if (!window._txOffcanvasSwapBound) {
        window._txOffcanvasSwapBound = true;
        document.body.addEventListener('htmx:afterSwap', function (evt) {
          if (evt.detail.target.id !== 'tx-offcanvas-body') return;
          var el = document.getElementById('txOffcanvas');
          if (el && !el.classList.contains('show')) {
            bootstrap.Offcanvas.getOrCreateInstance(el).show();
          }
        });
      }

      // A boosted nav (Bank submenu, a partner link inside the offcanvas, ...)
      // replaces <body>'s innerHTML wholesale, so a still-open offcanvas/modal
      // is yanked out without ever running Bootstrap's own hide() cleanup.
      // Bootstrap's scroll-lock class+styles, which it sets directly on the
      // <body> ELEMENT — surviving the swap just like the rest of the
      // element's attributes do — are then stuck forever (the leftover
      // "modal-open" class alone still forces overflow:hidden via Bootstrap's
      // CSS even once the inline overflow/padding-right props are cleared). A
      // freshly boosted page never legitimately has one open, so clear them
      // whenever nothing is actually shown — not gated to a body-level swap:
      // controlling/timesheet's modals now submit against a scoped
      // "#timesheet-content" target (see the explicit modal .hide() below),
      // and that scoped swap still yanks the modal's DOM out the same way,
      // still leaving these stuck on <body>.
      if (!window._boostScrollLockFixBound) {
        window._boostScrollLockFixBound = true;
        document.body.addEventListener('htmx:afterSwap', function () {
          if (document.querySelector('.modal.show')) return;
          document.body.classList.remove('modal-open');
          document.body.style.removeProperty('overflow');
          document.body.style.removeProperty('padding-right');
        });
      }

      // A modal form's hx-post (e.g. controlling/timesheet's "Új"/edit
      // records) swaps its own container out from under the still-open
      // Bootstrap modal it was submitted from, without ever running
      // Bootstrap's own hide() — same class of problem as the boosted-nav
      // case above, just via a scoped target instead of body. Close it
      // properly, before htmx swaps anything, so Bootstrap's real cleanup
      // (backdrop, focus trap, the body scroll-lock cleared above) runs.
      if (!window._modalHideBeforeSwapBound) {
        window._modalHideBeforeSwapBound = true;
        document.body.addEventListener('htmx:beforeSwap', function (evt) {
          var elt = evt.detail.requestConfig && evt.detail.requestConfig.elt;
          var modal = elt && elt.closest && elt.closest('.modal.show');
          if (modal) {
            bootstrap.Modal.getInstance(modal)?.hide();
          }
        });
      }

      // Every DataTable-driven page reinitializes its table from a page-local
      // <script> after its hx-post/hx-delete swap (e.g. saving a record on
      // controlling/timesheet or controlling/projects) by checking
      // $.fn.DataTable.isDataTable("#id") and destroying first. That check is
      // always a no-op here: htmx has already inserted the NEW <table id="…">
      // node into the DOM (detaching the old one) by the time that script
      // runs, so the selector resolves to the fresh node — never to the old
      // one — and the real live instance never gets destroy()ed. 'htmx:beforeSwap'
      // fires earlier, while the old content (and its live DataTable instance)
      // is still attached, so destroy any live DataTable there instead, before
      // htmx gets a chance to detach it — avoids leaking the old instance
      // ('htmx:beforeCleanupElement' looked like the right hook too, firing once
      // per discarded element, but by then the old subtree is already detached
      // and isDataTable() requires the node to still be document-connected, so
      // it silently reports false and skips destroy — confirmed by
      // instrumenting it live). Looks at the whole document rather than
      // scoping to evt.detail.target: that target is now often a nested
      // container (e.g. "#timesheet-content"), not body, but a stale
      // not-yet-destroyed instance is a problem regardless of which element
      // is about to be swapped.
      if (!window._dataTableSwapCleanupBound) {
        window._dataTableSwapCleanupBound = true;
        document.body.addEventListener('htmx:beforeSwap', function () {
          document.querySelectorAll('table.dataTable').forEach(function (el) {
            if ($.fn.DataTable.isDataTable(el)) {
              $(el).DataTable().destroy();
            }
          });
        });
      }

      // Even with the old instance properly destroyed above, the brand new
      // DataTable created synchronously by the swapped-in page script still
      // comes out missing its "dataTable dtr-inline collapsed" classes — the
      // Responsive extension's one-time, init-time column/width calculation
      // doesn't come out right when run synchronously mid-swap (confirmed live:
      // right after such a swap the table permanently lacks these classes no
      // matter how long you wait — it's not a transient timing race that
      // settles on its own). What DOES fix it, confirmed live: dispatching a
      // real 'resize' event afterwards, which drives Responsive's normal,
      // well-exercised resize-recalculation path and reproduces byte-for-byte
      // the same classes/hidden-columns a fresh full page load would produce.
      // (The more "proper"-looking `api.responsive.recalc()` call does NOT —
      // it takes a different internal path meant for columns being added or
      // removed, and left this app's tables showing extra columns a fresh load
      // would have collapsed.) Centralized here, once, rather than duplicated
      // in every DataTable-using page's own reinit script.
      // Tried 'htmx:afterSwap' first: racy, since it fired inconsistently
      // before vs. after the swapped-in page's own <script> had actually run
      // "new DataTable(...)" — the resize kick sometimes preceded, and so
      // missed, the table it was meant to fix. Tried 'htmx:afterSettle' next:
      // reliable across repeated *automated* clicks, but a real user clicking
      // through at native speed still hit the same race — automation's
      // request/response round-trips between actions apparently added enough
      // incidental delay to mask it. Neither hangs a fix off htmx's internal
      // (undocumented, and evidently not fully deterministic) script-execution
      // timing at all: DataTables itself fires 'init.dt' on the table the
      // moment a "new DataTable(...)" call actually finishes constructing it,
      // so listen for that instead — it can only ever fire once the table
      // genuinely exists, regardless of how htmx got there or how fast the
      // user clicks. Deferred one macrotask out via setTimeout(…, 0): 'init.dt'
      // fires as the last step *inside* the "new DataTable(...)" call, so
      // dispatching 'resize' straight from the handler would re-enter
      // DataTables' own resize/Responsive code while that constructor call is
      // still on the stack — let it finish and return first.
      if (!window._dataTableResizeKickBound) {
        window._dataTableResizeKickBound = true;
        $(document).on('init.dt', function () {
          setTimeout(function () {
            window.dispatchEvent(new Event('resize'));
          }, 0);
        });
      }
    })();
  </script>

  <!-- Shared manual-link picker modal -->
  <div class="modal fade" id="pickerModal" tabindex="-1" aria-labelledby="pickerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="pickerModalLabel">Kapcsolat kiválasztása</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
        </div>
        <div class="modal-body" id="picker-modal-body">
          <p class="text-muted">Betöltés…</p>
        </div>
      </div>
    </div>
  </div>
  <div id="picker-preview-popup" style="display:none; position:fixed; z-index:2000; max-width:640px; max-height:85vh; padding:4px; background:#fff; border:1px solid #ccc; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:none;">
    <img style="max-width:100%; max-height:calc(85vh - 8px); display:block;">
  </div>
  <script>
    (function () {
      var pickerModal = document.getElementById('pickerModal');

      var $pickerPreview = $('#picker-preview-popup');
      var $pickerPreviewImg = $pickerPreview.find('img');
      $('#picker-modal-body').on('mouseenter', 'tr', function () {
        var data = $(this).data('preview');
        if (!data) return;
        $pickerPreviewImg.attr('src', 'data:image/png;base64,' + data);
        $pickerPreview.show();
      });
      $('#picker-modal-body').on('mousemove', 'tr', function (e) {
        if ($pickerPreview.is(':visible')) {
          var w = $pickerPreview.outerWidth();
          var h = $pickerPreview.outerHeight();
          var top = e.clientY + 16;
          var left = e.clientX + 16;
          if (left + w > window.innerWidth) left = e.clientX - w - 16;
          if (top + h > window.innerHeight) top = Math.max(8, window.innerHeight - h - 8);
          $pickerPreview.css({ top: top, left: left });
        }
      });
      $('#picker-modal-body').on('mouseleave', 'tr', function () {
        $pickerPreview.hide();
      });

      // Bootstrap 5.3 bug: modal + offcanvas focus traps recurse infinitely.
      // Work-around: hide the offcanvas before the modal opens; restore it after.
      pickerModal.addEventListener('show.bs.modal', function (e) {
        pickerModal._pickerUrl = e.relatedTarget
          ? e.relatedTarget.getAttribute('data-picker-url')
          : null;
        var ocEl = document.querySelector('.offcanvas.show');
        pickerModal._sourceOffcanvas = ocEl || null;
        if (ocEl) { bootstrap.Offcanvas.getInstance(ocEl)?.hide(); }
      });

      pickerModal.addEventListener('shown.bs.modal', function () {
        var url = pickerModal._pickerUrl;
        if (!url) return;
        fetch(url)
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var body = document.getElementById('picker-modal-body');
            body.innerHTML = html;
            htmx.process(body);          // register hx-post forms with HTMX
            var tbl = body.querySelector('table[id]');
            if (!tbl) return;
            if ($.fn.DataTable.isDataTable('#' + tbl.id)) {
              $('#' + tbl.id).DataTable().destroy();
            }
            var colDefs = [{ targets: -1, searchable: false, orderable: false }];
            if (tbl.id === 'picker-invoice-files-table') {
              colDefs.push({ targets: -2, visible: false });
            }
            new DataTable('#' + tbl.id, {
              language: { url: 'https://cdn.datatables.net/plug-ins/2.0.8/i18n/hu.json', emptyTable: 'Nincs találat' },
              pageLength: 10,
              lengthMenu: [10, 25, 50],
              autoWidth: false,
              columnDefs: colDefs,
            });
          });
      });

      pickerModal.addEventListener('hidden.bs.modal', function () {
        $pickerPreview.hide();
        var body = document.getElementById('picker-modal-body');
        var tbl = body.querySelector('table[id]');
        if (tbl && $.fn.DataTable.isDataTable('#' + tbl.id)) {
          $('#' + tbl.id).DataTable().destroy();
        }
        body.innerHTML = '<p class="text-muted">Betöltés…</p>';
        // Restore the offcanvas (if not already re-opened by htmx:afterSwap)
        var ocEl = pickerModal._sourceOffcanvas;
        if (ocEl && !ocEl.classList.contains('show')) {
          bootstrap.Offcanvas.getOrCreateInstance(ocEl).show();
        }
        pickerModal._sourceOffcanvas = null;
      });
    })();
  </script>
</body>
</html>
