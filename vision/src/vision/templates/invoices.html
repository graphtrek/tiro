{% extends "base.html" %}
{% block title %}Számlák — Moneypenny{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/ui/">Dashboard</a></li>
    <li class="breadcrumb-item active">Számlák</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<h1 class="h3 mb-4"><i class="bi bi-file-earmark-text me-2"></i>Számlák</h1>

<div class="card">
  <div class="card-body pt-3">
    <div id="table-container">
      {% include "partials/invoice_table.html" %}
    </div>
  </div>
</div>

<!-- Transaction detail offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="txOffcanvas" style="width:420px">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title"><i class="bi bi-bank me-2 text-info"></i>Tranzakció részletei</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body" id="tx-offcanvas-body">
    <p class="text-muted">Válasszon ki egy tranzakciót a listából.</p>
  </div>
</div>
{% endblock %}
