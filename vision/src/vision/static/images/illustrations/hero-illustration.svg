<svg viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- backdrop blob -->
  <path d="M180 40 C320 -10 480 30 540 140 C600 250 580 380 470 440 C360 500 200 490 110 410 C20 330 10 190 70 110 C100 70 140 55 180 40 Z" fill="#efeafd"/>

  <!-- soft floor shadow -->
  <ellipse cx="330" cy="452" rx="220" ry="24" fill="#5b4be0" opacity="0.08"/>

  <!-- desk -->
  <rect x="70" y="382" width="500" height="18" rx="9" fill="#2c2150"/>
  <rect x="96" y="400" width="16" height="46" rx="4" fill="#3d2b66"/>
  <rect x="528" y="400" width="16" height="46" rx="4" fill="#3d2b66"/>

  <!-- laptop -->
  <g>
    <rect x="230" y="228" width="180" height="120" rx="10" fill="#2c2150"/>
    <rect x="242" y="240" width="156" height="96" rx="4" fill="#f4f1ea"/>
    <!-- bar chart on screen -->
    <rect x="258" y="298" width="16" height="26" rx="2" fill="#0891b2"/>
    <rect x="282" y="284" width="16" height="40" rx="2" fill="#5b4be0"/>
    <rect x="306" y="270" width="16" height="54" rx="2" fill="#17a750"/>
    <rect x="330" y="290" width="16" height="34" rx="2" fill="#d97e0a"/>
    <path d="M258 262 L282 274 L306 250 L330 258 L354 240" stroke="#5b4be0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <rect x="216" y="348" width="208" height="14" rx="7" fill="#3d2b66"/>
  </g>

  <!-- invoice card, left, tilted -->
  <g transform="rotate(-8 160 300)">
    <rect x="112" y="240" width="120" height="150" rx="12" fill="#ffffff" stroke="rgba(30,20,60,0.10)" stroke-width="1.5"/>
    <rect x="132" y="262" width="60" height="10" rx="5" fill="#5b4be0" opacity="0.7"/>
    <rect x="132" y="282" width="80" height="6" rx="3" fill="#c9c3e0"/>
    <rect x="132" y="296" width="80" height="6" rx="3" fill="#c9c3e0"/>
    <rect x="132" y="310" width="56" height="6" rx="3" fill="#c9c3e0"/>
    <rect x="132" y="336" width="80" height="1" fill="rgba(30,20,60,0.10)"/>
    <rect x="132" y="350" width="40" height="10" rx="5" fill="#17a750" opacity="0.85"/>
    <circle cx="205" cy="248" r="16" fill="#17a750"/>
    <path d="M198 248 l5 5 l9 -10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- envelope, top right, floating -->
  <g transform="translate(452 150)">
    <rect x="0" y="0" width="86" height="60" rx="10" fill="#ffffff" stroke="rgba(30,20,60,0.12)" stroke-width="1.5"/>
    <path d="M4 6 L43 36 L82 6" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ai orb near laptop -->
  <g transform="translate(408 206)">
    <circle cx="0" cy="0" r="26" fill="#5b4be0" opacity="0.14"/>
    <circle cx="0" cy="0" r="15" fill="#5b4be0"/>
    <path d="M-5 0 l4 4 l7 -9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- sparkle stars -->
  <g fill="#d97e0a">
    <path d="M498 100 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 Z"/>
  </g>
  <g fill="#c026d3">
    <path d="M116 168 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
  </g>
  <g fill="#5b4be0">
    <path d="M540 320 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
  </g>
</svg>
