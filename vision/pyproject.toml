[project]
name = "vision"
version = "0.1.0"
description = "Read-only ownership dashboard aggregator — invoice-core + SrcProfit"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
