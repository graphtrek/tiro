[project]
name = "invoice-file-filter"
version = "0.1.0"
description = "PDF invoice metadata extraction microservice (Moneypenny invoice-file-filter) with FastAPI and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyjwt[crypto]>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "rich>=13.0",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "Pillow>=10.0",
]

[project.scripts]
invoice-file-filter = "invoice_file_filter.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
