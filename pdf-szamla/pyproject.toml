[project]
name = "pdf-szamla"
version = "0.1.0"
description = "PDF invoice metadata extraction microservice (Moneypenny pdf-szamla) with FastAPI and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
pdf-szamla = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdf_szamla*", "api*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
