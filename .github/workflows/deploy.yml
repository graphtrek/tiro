name: Build & Push

on:
  push:
    branches:
      - main          # trigger on every push to main
  workflow_dispatch:  # allow manual runs from the GitHub UI

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is automatically set to  <owner>/<repo>  in lowercase
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    # Required to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pull BuildKit from GHCR instead of Docker Hub to avoid rate limits
          driver-opts: image=ghcr.io/moby/buildkit:buildx-stable-1

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Build for both Intel/AMD servers and ARM servers (e.g. Raspberry Pi, Apple Silicon)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
