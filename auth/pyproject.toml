[project]
name = "auth"
version = "0.1.0"
description = "Központi authentication mikroszerviz (Google OAuth 2.0 / OIDC + JWT) a Moneypenny rendszerhez"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
auth = "auth_service.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
