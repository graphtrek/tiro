[project]
name = "obsidian-vault-agent"
version = "0.1.0"
description = "Chat with any wiki-based Obsidian vault from the command line"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=6.0",
    "fastapi>=0.115",
    "headroom-ai[proxy]>=0.27",
    "httpx>=0.27",
    "pydantic-ai>=2.5.0",
    "pydantic-ai-harness>=0.5.0",
    "python-dotenv>=1.2.2",
    "rich>=13.7",
    "uvicorn>=0.30",
]
