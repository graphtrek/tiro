[project]
name = "wise-invoice"
version = "0.1.0"
description = "Wise bank statement sync microservice (Moneypenny wise) with FastAPI and CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "cryptography>=44.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
wise-invoice = "wise_invoice.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
