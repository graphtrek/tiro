[project]
name = "attachment-downloader"
version = "0.1.0"
description = "A CLI and FastAPI interface for Gmail access."
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "google-api-python-client>=0.120.0",
    "google-auth-oauthlib>=0.16.0",
    "google-auth-httplib2>=0.1.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
]
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
]

[project.scripts]
attachment-downloader = "attachment_downloader.cli.main:app"
