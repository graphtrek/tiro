[project]
name = "invoice-core"
version = "0.1.0"
description = "Master orchestrator microservice for Moneypenny invoice automation pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.8",
    "certifi>=2024.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "alembic>=1.13",
]

[project.scripts]
invoice-core = "invoice_core.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "BLE", "DTZ", "RUF", "C4"]
# B008: FastAPI's `Query/Depends(...)` defaults in function signatures are idiomatic.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures construct naive datetimes (`datetime(Y, M, D)`) to seed the
# naive-UTC `DateTime` columns (see src/invoice_core/timeutil.py). DTZ001
# flags the missing `tzinfo=`, but adding one would make the value aware and
# break comparisons against those naive columns — so it's intentionally off
# here.
"tests/*" = ["DTZ001"]
