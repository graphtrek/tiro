[project]
name = "invoice-core"
version = "0.1.0"
description = "Master orchestrator microservice for Moneypenny invoice automation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyjwt[crypto]>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[project.scripts]
invoice-core = "invoice_core.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
