[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-for-ai"
version = "0.1.0"
description = "Multi-project workspace for GDPR-compliant AI assistants and tools"
readme = "README.md"
authors = [
    {name = "Imre Tatai", email = "imre.tatai@graphtrek.co"}
]
requires-python = ">=3.10"

[tool.setuptools]
# Workspace definition with sub-projects
# Each sub-project maintains its own venv and requirements.txt

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | venv
  | __pycache__
  | \.git
  | \.github
  | chroma_db
  | generated_programs
  | uploads
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["packages"]
skip_glob = [".venv/*", "venv/*", "chroma_db/*", "generated_programs/*"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    ".venv",
    "venv",
    ".git",
    "chroma_db",
    "generated_programs",
]

[tool.pytest.ini_options]
testpaths = ["nothing-gets-out/tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "chroma_db", "generated_programs", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long (handled by black)

# Sub-projects configuration
[tool.workspace]
projects = [
    "nothing-gets-out",  # Main: GDPR-compliant on-premise AI assistant
    "tutorials",         # OpenAI SDK examples (LM Studio + Scaleway)
    "hikari-slides",     # PowerPoint generation for Hungarian SME AI strategy decks
]

[tool.nothing-gets-out]
description = "Primary project: Streamlit UI + FastAPI backend for GDPR-compliant AI"
python_version = ">=3.10"
models = [
    "mistral-small-3.2-24b-instruct-2506",
    "qwen3-coder-30b-a3b-instruct"
]

[tool.tutorials]
description = "OpenAI SDK integration examples with LM Studio and Scaleway"

[tool.hikari-slides]
description = "AI-powered PowerPoint generation for Hungarian SME strategy presentations"
