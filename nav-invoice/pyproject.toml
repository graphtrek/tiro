[project]
name = "nav-invoice"
version = "0.1.0"
description = "NAV Online Számla client with FastAPI and CLI support"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.8",
    "certifi>=2024.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "lxml>=5.0",
    "cryptography>=44.0",
    "click>=8.1",
]

[project.scripts]
nav = "nav_invoice.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "BLE", "DTZ", "RUF", "C4"]
# B008: FastAPI's `Depends()` / `Body()` defaults are an intentional framework idiom.
ignore = ["B008"]
