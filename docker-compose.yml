services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: graphtrek
      POSTGRES_PASSWORD: graphtrek
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphtrek -d invoice"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: imre.tatai@graphtrek.co
      PGADMIN_DEFAULT_PASSWORD: graphtrek
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Read by pgadmin/config_local.py to configure Google OAuth2 login.
      # Register http://<PUBLIC_HOST>:5050/oauth2/authorize as the redirect
      # URI on this Google OAuth client.
      OAUTH2_GOOGLE_CLIENT_ID: ${PGADMIN_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${PGADMIN_GOOGLE_CLIENT_SECRET}
      OAUTH2_GOOGLE_HD: ${PGADMIN_GOOGLE_HD:-}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/config_local.py:/pgadmin4/config_local.py:ro
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  auth:
    build: ./auth
    env_file: ./auth/.env
    environment:
      API_PORT: 8007
      INVOICE_CORE_URL: http://invoice-core:8004
      # Browser-facing redirect target after login — must be reachable from the
      # user's browser, not the Docker-internal service name.
      VISION_URL: http://${PUBLIC_HOST:-localhost}:8009
    ports:
      - "8007:8007"
    volumes:
      - auth-keys:/app/keys
    restart: unless-stopped

  attachment-downloader:
    build: ./attachment-downloader
    env_file: ./attachment-downloader/.env
    environment:
      API_PORT: 8000
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "8000:8000"
    volumes:
      - downloads-data:/app/downloads
      - ./attachment-downloader/credentials.json:/app/credentials.json:ro
      - ./attachment-downloader/token.json:/app/token.json
    depends_on:
      - auth
    restart: unless-stopped

  nav-invoice:
    build: ./nav-invoice
    env_file: ./nav-invoice/.env
    environment:
      API_PORT: 8002
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "8002:8002"
    depends_on:
      - auth
    restart: unless-stopped

  bank:
    build: ./bank
    env_file: ./bank/.env
    environment:
      API_PORT: 8005
      AUTH_SERVICE_URL: http://auth:8007
      BALANCE_STATEMENTS_DIR: /data/bank-storage
    ports:
      - "8005:8005"
    volumes:
      - bank-storage:/data/bank-storage
    depends_on:
      - auth
    restart: unless-stopped

  uploader:
    build: ./uploader
    env_file: ./uploader/.env
    environment:
      API_PORT: 8006
      AUTH_SERVICE_URL: http://auth:8007
      STORAGE_DIR: /data/bank-storage
    ports:
      - "8006:8006"
    volumes:
      - bank-storage:/data/bank-storage
    depends_on:
      - auth
    restart: unless-stopped

  invoice-file-filter:
    build: ./invoice-file-filter
    env_file: ./invoice-file-filter/.env
    environment:
      API_PORT: 8001
      ATTACHMENT_DOWNLOADER_URL: http://attachment-downloader:8000
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "8001:8001"
    volumes:
      - downloads-data:/app/downloads
    depends_on:
      - attachment-downloader
      - auth
    restart: unless-stopped

  invoice-core:
    build: ./invoice-core
    env_file: ./invoice-core/.env
    environment:
      API_PORT: 8004
      DB_URL: jdbc:postgresql://db:5432/invoice
      DB_USER: graphtrek
      DB_PWD: graphtrek
      NAV_INVOICE_URL: http://nav-invoice:8002
      INVOICE_FILE_FILTER_URL: http://invoice-file-filter:8001
      BANK_URL: http://bank:8005
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "8004:8004"
    volumes:
      - downloads-data:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      nav-invoice:
        condition: service_started
      invoice-file-filter:
        condition: service_started
      bank:
        condition: service_started
    restart: unless-stopped

  vision:
    build: ./vision
    env_file: ./vision/.env
    environment:
      API_PORT: 8009
      INVOICE_CORE_URL: http://invoice-core:8004
      # Internal (container-to-container) auth calls.
      AUTH_SERVICE_URL: http://auth:8007
      # Browser-facing auth URL (login links, silent-refresh fetch) — must be
      # reachable from the user's browser, not the Docker-internal service name.
      AUTH_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:8007
    ports:
      - "8009:8009"
    depends_on:
      - invoice-core
    restart: unless-stopped

  # Container log viewer (https://dozzle.dev). Not published directly — only
  # reachable through dozzle-auth, which enforces Google login in front of it.
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-Forwarded-User
      DOZZLE_AUTH_HEADER_EMAIL: X-Forwarded-Email
      DOZZLE_AUTH_HEADER_NAME: X-Forwarded-Preferred-Username
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # oauth2-proxy sits in front of Dozzle and handles the actual Google login;
  # Dozzle trusts the X-Forwarded-* headers it sets once a session is authenticated.
  dozzle-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${DOZZLE_GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${DOZZLE_GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${DOZZLE_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${DOZZLE_EMAIL_DOMAIN:-*}
      OAUTH2_PROXY_REDIRECT_URL: http://${PUBLIC_HOST:-localhost}:8008/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://dozzle:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: "false"
    ports:
      - "8008:4180"
    depends_on:
      - dozzle
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:
  downloads-data:
  bank-storage:
  auth-keys:
