services:
  graphtrek-ai-chat:
    image: ghcr.io/graphtrek/python-for-ai:latest
    container_name: graphtrek-ai-chat
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Reach the manager via Docker's internal service DNS, not localhost
      - MANAGER_API_URL=http://graphtrek-ai-manager:8500
      - PROGRAMS_HOST=ai.graphtrek.co
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./ai.log:/app/ai.log
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./generated_programs:/app/generated_programs

  graphtrek-ai-manager:
    image: ghcr.io/graphtrek/python-for-ai:latest
    container_name: graphtrek-ai-manager
    restart: unless-stopped
    # Port 8500 = manager API; 8600-8700 = generated program services
    ports:
      - "8500:8500"
      - "8600-8700:8600-8700"
    env_file:
      - .env
    volumes:
      # Generated programs are stored on the host for persistence and inspection
      - ./generated_programs:/app/generated_programs
      - ./ai.log:/app/ai.log
      # Credentials needed by generated programs that use Drive / Gmail helpers
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    command: ["uvicorn", "manager_api:app", "--host", "0.0.0.0", "--port", "8500"]
