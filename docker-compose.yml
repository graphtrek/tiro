services:
  db:
    image: postgres:16-alpine
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: imre.tatai@graphtrek.co
      PGADMIN_DEFAULT_PASSWORD: graphtrek
      # Must be True for Google OAuth2 login below to take effect — desktop
      # mode (False) auto-authenticates the browser and skips login entirely.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # Read by pgadmin/config_local.py to configure Google OAuth2 login.
      # Register https://<PUBLIC_HOST>:5050/oauth2/authorize as the redirect
      # URI on this Google OAuth client — nginx terminates TLS on 5050 and
      # proxies to this container over loopback (see config_local.py for the
      # PROXY_X_* settings that make pgAdmin trust nginx's X-Forwarded-Proto).
      OAUTH2_GOOGLE_CLIENT_ID: ${PGADMIN_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${PGADMIN_GOOGLE_CLIENT_SECRET}
      OAUTH2_GOOGLE_HD: ${PGADMIN_GOOGLE_HD:-}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/config_local.py:/pgadmin4/config_local.py:ro
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    restart: unless-stopped

  auth:
    build: ./auth
    env_file: ./.env
    environment:
      API_PORT: 8007
      INVOICE_CORE_URL: http://invoice-core:8004
      # Browser-facing redirect targets — must be reachable from the user's
      # browser, not the Docker-internal service name. OAUTH_REDIRECT_URL must
      # also be registered as an authorized redirect URI on the Google OAuth
      # client (Google Cloud Console → Credentials). Both go through the
      # nginx/TLS front door on the bare domain — no port, since 8007/8009
      # aren't directly TLS-terminated.
      VISION_URL: https://${PUBLIC_HOST:-localhost}
      OAUTH_REDIRECT_URL: https://${PUBLIC_HOST:-localhost}/auth/google/callback
    ports:
      - "127.0.0.1:8007:8007"
    volumes:
      - auth-keys:/app/keys
    restart: unless-stopped

  attachment-downloader:
    build: ./attachment-downloader
    env_file: ./.env
    environment:
      API_PORT: 8000
      AUTH_SERVICE_URL: http://auth:8007
      # Exception to the shared AUTH_ENABLED=true default in .env — this
      # service is still called unauthenticated by the invoice-core sync CLI.
      AUTH_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - downloads-data:/app/downloads
      - ./attachment-downloader/credentials.json:/app/credentials.json:ro
      - ./attachment-downloader/token.json:/app/token.json
    depends_on:
      - auth
    restart: unless-stopped

  nav-invoice:
    build: ./nav-invoice
    env_file: ./.env
    environment:
      API_PORT: 8002
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - auth
    restart: unless-stopped

  bank:
    build: ./bank
    env_file: ./.env
    environment:
      API_PORT: 8005
      AUTH_SERVICE_URL: http://auth:8007
      BALANCE_STATEMENTS_DIR: /data/bank-storage
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - bank-storage:/data/bank-storage
    depends_on:
      - auth
    restart: unless-stopped

  uploader:
    build: ./uploader
    env_file: ./.env
    environment:
      API_PORT: 8006
      AUTH_SERVICE_URL: http://auth:8007
      STORAGE_DIR: /data/bank-storage
    ports:
      - "127.0.0.1:8006:8006"
    volumes:
      - bank-storage:/data/bank-storage
    depends_on:
      - auth
    restart: unless-stopped

  invoice-file-filter:
    build: ./invoice-file-filter
    env_file: ./.env
    environment:
      API_PORT: 8001
      ATTACHMENT_DOWNLOADER_URL: http://attachment-downloader:8000
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - downloads-data:/app/downloads
    depends_on:
      - attachment-downloader
      - auth
    restart: unless-stopped

  invoice-core:
    build: ./invoice-core
    env_file: ./.env
    environment:
      API_PORT: 8004
      # Container-to-container traffic uses Postgres's fixed internal port
      # (5432 inside the `db` container), independent of the host-side
      # DB_PORT remap used in the `ports:` mapping below.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      NAV_INVOICE_URL: http://nav-invoice:8002
      INVOICE_FILE_FILTER_URL: http://invoice-file-filter:8001
      BANK_URL: http://bank:8005
      AUTH_SERVICE_URL: http://auth:8007
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - downloads-data:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      nav-invoice:
        condition: service_started
      invoice-file-filter:
        condition: service_started
      bank:
        condition: service_started
    restart: unless-stopped

  vision:
    build: ./vision
    env_file: ./.env
    environment:
      API_PORT: 8009
      INVOICE_CORE_URL: http://invoice-core:8004
      # Internal (container-to-container) auth calls.
      AUTH_SERVICE_URL: http://auth:8007
      # Browser-facing auth URL (login links, silent-refresh fetch) — must be
      # reachable from the user's browser, not the Docker-internal service name.
      # Goes through the nginx/TLS front door on the bare domain, same as
      # VISION_URL/OAUTH_REDIRECT_URL in the auth service above.
      AUTH_PUBLIC_URL: https://${PUBLIC_HOST:-localhost}
    ports:
      - "127.0.0.1:8009:8009"
    depends_on:
      - invoice-core
    restart: unless-stopped

  # Container log viewer (https://dozzle.dev). Not published directly — only
  # reachable through dozzle-auth, which enforces Google login in front of it.
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: X-Forwarded-User
      DOZZLE_AUTH_HEADER_EMAIL: X-Forwarded-Email
      DOZZLE_AUTH_HEADER_NAME: X-Forwarded-Preferred-Username
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # oauth2-proxy sits in front of Dozzle and handles the actual Google login;
  # Dozzle trusts the X-Forwarded-* headers it sets once a session is authenticated.
  dozzle-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${DOZZLE_GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${DOZZLE_GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${DOZZLE_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${DOZZLE_EMAIL_DOMAIN:-*}
      # Dozzle lives on its own subdomain in production (e.g. tirologs.example.com),
      # separate from PUBLIC_HOST (used by auth/vision) — set DOZZLE_REDIRECT_URL
      # explicitly there. Register this exact URI as the redirect URI on the
      # Google OAuth client.
      OAUTH2_PROXY_REDIRECT_URL: ${DOZZLE_REDIRECT_URL:-http://localhost:8008/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: http://dozzle:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    ports:
      - "127.0.0.1:8008:4180"
    depends_on:
      - dozzle
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:
  downloads-data:
  bank-storage:
  auth-keys:
