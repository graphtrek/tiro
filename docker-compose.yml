services:
  graphtrek-ai-chat:
    # Pull the pre-built image from GitHub Container Registry.
    # Replace <your-github-username> and <your-repo> with your actual values.
    image: ghcr.io/graphtrek/python-for-ai:latest

    container_name: graphtrek-ai-chat

    restart: unless-stopped

    ports:
      # Map host port 8501 → container port 8501.
      # Change the left side to use a different host port, e.g. "80:8501"
      - "8501:8501"

    # Secrets are passed as environment variables at runtime.
    # On the server: copy .env.example → .env and fill in real values.
    # The .env file is never baked into the image.
    env_file:
      - .env

    volumes:
      # Persist uploaded files across container restarts
      - ./uploads:/app/uploads
      # Persist ChromaDB embeddings so files are not re-indexed on every restart
      - ./chroma_db:/app/chroma_db
      # Persist log file on the host so it survives container restarts
      - ./ai.log:/app/ai.log
